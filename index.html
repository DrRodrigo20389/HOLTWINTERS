<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SKYNET V51 - AUTO-CAPTURE SNAPSHOT W1 (FIXED RETRO)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Verdana', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
        .toolbar { background: #050505; border-bottom: 2px solid #333; padding: 5px 15px; display: flex; align-items: center; justify-content: space-between; height: 60px; flex-shrink: 0; }
        .logo-sub { font-size: 0.65rem; color: #00ff41; font-weight: 900; }
        .live-price { font-size: 1.2rem; font-weight: bold; font-family: monospace; color: #00ff41; }
        .main-container { flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative; }
        .chart-container { width: 100%; height: 100%; position: relative; background: #000; overflow: hidden; cursor: crosshair; }
        .time-label { position: absolute; top: 10px; left: 15px; font-size: 0.85rem; font-weight: 900; color: #00ff41; z-index: 11; }
        .hud-tag { position: absolute; top: 35px; left: 15px; pointer-events: none; background: rgba(0,0,0,0.9); border-left: 3px solid #00ff41; padding: 8px 15px; border-radius: 4px; z-index: 10; border: 1px solid #333; min-width: 200px; }
        .reset-btn { position: absolute; top: 10px; right: 15px; background: rgba(0, 255, 65, 0.1); border: 1px solid #00ff41; color: #00ff41; padding: 6px 14px; font-size: 0.75rem; cursor: pointer; z-index: 1000; border-radius: 3px; font-weight: bold; }
        .val-atual { color: #00ff41; font-weight: 900; font-size: 1.1rem; }
        .val-conv { font-weight: 900; font-size: 0.9rem; margin-top: 3px; transition: color 0.3s; }
        .dif-text { font-size: 0.75rem; color: #888; }
        .snap-status { font-size: 0.75rem; color: #00ffff; font-weight: bold; margin-top: 4px; }
        
        .time-controls { display: flex; align-items: center; gap: 8px; background: #111; padding: 4px 12px; border-radius: 4px; border: 1px solid #333; }
        .time-btn { background: #222; border: 1px solid #00ff41; color: #00ff41; padding: 5px 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border-radius: 3px; }
        .time-btn:hover { background: #00ff41; color: #000; }
        .time-btn-reset { border-color: #ff3333; color: #ff3333; }
        .time-btn-reset:hover { background: #ff3333; color: #fff; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div style="line-height:1">
            <div style="font-size:1.2rem; font-weight:900;">SKYNET</div>
            <div class="logo-sub">W1 AUTO SNAPSHOT ENGINE</div>
        </div>
        
        <div class="inputs">
            <input type="text" id="symbol" value="BTCBRL" style="background:#111; border:1px solid #444; color:#fff; padding:6px; width:85px; text-align:center; font-weight:bold;">
            <button onclick="startSystem()" style="background:#00ff41; color:#000; border:none; padding:7px 14px; font-weight:900; cursor:pointer; border-radius:4px; margin-left:5px;">SCAN</button>
        </div>

        <div class="time-controls">
            <button class="time-btn" onclick="stepTime(1)">◀ -1 Semanal</button>
            <button class="time-btn" onclick="stepTime(-1)">+1 Semanal ▶</button>
            <button class="time-btn time-btn-reset" onclick="resetTime()">LIVE</button>
        </div>

        <div class="live-price" id="mainPrice">---.---</div>
    </div>

    <div class="main-container">
        <div class="chart-container">
            <div class="time-label">W1 - VISÃO SEMANAL (NAVEGAÇÃO RETROATIVA CORRIGIDA)</div>
            <button class="reset-btn" onclick="resetScale()">RESET ESCALA</button>
            <div class="hud-tag">
                <div id="targetW" class="val-atual">ATUAL: ---</div>
                <div id="convW" class="val-conv">CONV: ---</div>
                <div id="diffW" class="dif-text">DIF: ---</div>
                <div id="snapW" class="snap-status">SNAP: ESCANEANDO...</div>
            </div>
            <canvas id="chartW"></canvas>
        </div>
    </div>

    <script>
        let chartW, histW = [];
        let ws;
        let timeShift = 0;
        const colors = ['#00FFFF', '#FF00FF', '#FFFF00', '#FF8C00'];

        let singleSnapshotW = null;

        function resetScale() {
            if(!chartW) return;
            chartW.options.scales.x.min = undefined; chartW.options.scales.x.max = undefined;
            chartW.options.scales.y.min = undefined; chartW.options.scales.y.max = undefined;
            chartW.update();
        }

        function stepTime(delta) {
            // Garante que o timeShift não ultrapasse o limite de histórico navegável
            const maxShift = Math.max(0, histW.length - 90);
            timeShift = Math.min(maxShift, Math.max(0, timeShift + delta));
            refreshEngine();
        }

        function resetTime() {
            timeShift = 0;
            refreshEngine();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') stepTime(1);
            if (e.key === 'ArrowRight') stepTime(-1);
        });

        async function startSystem() {
            if(ws) ws.close();
            const symbol = document.getElementById('symbol').value.toUpperCase();
            singleSnapshotW = null;
            timeShift = 0;
            document.getElementById('snapW').innerText = "SNAP: CARREGANDO... ";
            
            try {
                const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1w&limit=1000`);
                const data = await r.json();
                histW = data.map(d => ({ x: d[0], c: parseFloat(d[4]) }));
                
                autoScanLastSnapshot();
                connectStream(symbol); 
                refreshEngine();
            } catch(e) {
                console.error("Erro ao carregar dados:", e);
                document.getElementById('snapW').innerText = "ERRO AO CARREGAR PAR";
            }
        }

        function autoScanLastSnapshot() {
            if(histW.length < 90) return;
            
            const maxShift = Math.min(200, histW.length - 90);
            for (let shift = 0; shift < maxShift; shift++) {
                const subHist = histW.slice(0, histW.length - shift);
                const proj = getProjData(subHist, [1, 2, 3, 4]);
                
                if (proj && proj.isOppositeDirection && proj.amplitudeDiff > 0.18) {
                    singleSnapshotW = {
                        time: subHist[subHist.length - 1].x,
                        data: [{ x: subHist[subHist.length-1].x, y: subHist[subHist.length-1].c }, ...proj.main.points]
                    };
                    break;
                }
            }
        }

        function connectStream(symbol) {
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_1m`);
            ws.onmessage = (e) => {
                const p = parseFloat(JSON.parse(e.data).k.c);
                if (timeShift === 0) {
                    const prefix = symbol.includes('USD') ? '$' : 'R$';
                    document.getElementById('mainPrice').innerText = `${prefix} ${p.toLocaleString('pt-BR')}`;
                }
                if(histW.length) histW[histW.length-1].c = p;
                if (timeShift === 0) refreshEngine();
            };
        }

        function refreshEngine() {
            if (timeShift > 0) {
                document.getElementById('mainPrice').innerText = `[VOLTANDO ${timeShift} SEMANAS]`;
                document.getElementById('mainPrice').style.color = '#ff9900';
            } else {
                document.getElementById('mainPrice').style.color = '#00ff41';
            }

            runEngine(histW, chartW, 'targetW', 'diffW', 'convW', 'snapW', [1, 2, 3, 4]);
        }

        function calculateExtremeTarget(points, baseline) {
            let countAbove = points.filter(p => p.y > baseline).length;
            let values = points.map(p => p.y);
            return (countAbove > points.length / 2) ? Math.max(...values) : Math.min(...values);
        }

        // Função de projeção ajustada para suportar navegação retroativa profunda
        function getProjData(hist, offsets) {
            // Reduzido para 90 semanas de mínimo necessário
            if(!hist || hist.length < 90) return null; 
            
            const pLen = 40, fLen = 40;
            const step = hist[1].x - hist[0].x;

            const calcProj = (offset) => {
                const idx = hist.length - 1 - offset;
                // Verificação de segurança de limites de array
                if (idx - pLen < 0) return null;

                const cur = normalize(hist.slice(idx - pLen, idx));
                let bScore = Infinity, bIdx = -1;
                
                // Garante que o loop nunca tente acessar posições negativas
                const maxSearchIndex = idx - pLen - fLen - 1;
                if (maxSearchIndex <= 0) return null;

                for(let i = 0; i < maxSearchIndex; i++) {
                    const sample = hist.slice(i, i + pLen);
                    if(sample.length < pLen) continue;
                    
                    const s = calcE(cur, normalize(sample));
                    if(s < bScore) { bScore = s; bIdx = i; }
                }
                
                if(bIdx === -1) return null;
                
                const fut = hist.slice(bIdx + pLen, bIdx + pLen + fLen);
                if (fut.length === 0) return null;

                let lV = hist[idx].c, lT = hist[idx].x, bR = hist[bIdx + pLen - 1].c;
                return { points: fut.map((d, k) => ({ x: lT + ((k+1) * step), y: lV * (d.c / bR) })), baseline: lV };
            };

            const main = calcProj(0);
            if(!main) return null;
            const traces = offsets.map(o => calcProj(o));

            let mainSlope = (main.points[main.points.length - 1].y - main.baseline) / main.baseline;
            let validTraces = traces.filter(t => t !== null);
            let avgTraceSlope = 0;
            if (validTraces.length > 0) {
                let slopes = validTraces.map(t => (t.points[t.points.length - 1].y - t.baseline) / t.baseline);
                avgTraceSlope = slopes.reduce((a, b) => a + b, 0) / slopes.length;
            }

            let mainExtreme = calculateExtremeTarget(main.points, main.baseline);
            let isOppositeDirection = (mainSlope * avgTraceSlope < 0);
            let amplitudeDiff = Math.abs(mainExtreme - (validTraces.length ? calculateExtremeTarget(validTraces[0].points, validTraces[0].baseline) : mainExtreme)) / mainExtreme;

            return { main, traces, isOppositeDirection, amplitudeDiff, mainExtreme };
        }

        function runEngine(histFull, chart, tid, sid, cid, snapid, offsets) {
            const hist = timeShift > 0 ? histFull.slice(0, histFull.length - timeShift) : histFull;
            const res = getProjData(hist, offsets);
            
            if(!res) {
                document.getElementById(tid).innerText = `ATUAL: SEM DADOS SUFICIENTES`;
                document.getElementById(cid).innerText = `CONV: ---`;
                document.getElementById(sid).innerText = `DIF: ---`;
                chart.update('none');
                return;
            }

            const { main, traces, isOppositeDirection, amplitudeDiff, mainExtreme } = res;
            const symbol = document.getElementById('symbol').value.toUpperCase();
            const prefix = symbol.includes('USD') ? '$' : 'R$';

            document.getElementById(tid).innerText = `ATUAL: ${prefix} ${mainExtreme.toLocaleString('pt-BR', {maximumFractionDigits:0})}`;

            if (isOppositeDirection && amplitudeDiff > 0.18) {
                singleSnapshotW = {
                    time: hist[hist.length - 1].x,
                    data: [{ x: hist[hist.length-1].x, y: hist[hist.length-1].c }, ...main.points]
                };
            }

            if (singleSnapshotW) {
                const dateSnap = new Date(singleSnapshotW.time).toLocaleDateString('pt-BR');
                document.getElementById(snapid).innerText = `LAST SNAP: ${dateSnap}`;
                document.getElementById(snapid).style.color = '#00ffff';
            } else {
                document.getElementById(snapid).innerText = `SNAP: SEM GIRO RELEVANTE`;
                document.getElementById(snapid).style.color = '#555555';
            }

            let minDiff = Infinity, bestIdx = -1;
            traces.forEach((t, i) => {
                if(!t) return;
                const tExtreme = calculateExtremeTarget(t.points, t.baseline);
                const diff = Math.abs((mainExtreme - tExtreme) / mainExtreme);
                if(diff < minDiff) { minDiff = diff; bestIdx = i; }
            });

            if(bestIdx !== -1) {
                const convExtreme = calculateExtremeTarget(traces[bestIdx].points, traces[bestIdx].baseline);
                const convEl = document.getElementById(cid);
                convEl.innerText = `CONV: ${prefix} ${convExtreme.toLocaleString('pt-BR', {maximumFractionDigits:0})}`;
                convEl.style.color = colors[bestIdx]; 
                
                const dDisplay = ((mainExtreme - convExtreme) / mainExtreme * 100).toFixed(2);
                document.getElementById(sid).innerText = `DIF: ${dDisplay}%`;
            }

            chart.data.datasets[0].data = hist.slice(-250).map(d => ({x: d.x, y: d.c}));
            chart.data.datasets[1].data = [{x: hist[hist.length-1].x, y: hist[hist.length-1].c}, ...main.points];
            
            for(let i=0; i<4; i++) {
                chart.data.datasets[i+2].data = traces[i] ? traces[i].points : [];
            }

            if (!chart.data.datasets[6]) {
                chart.data.datasets.push({
                    label: 'ActiveSnapshot',
                    data: [],
                    borderColor: '#FFFFFF',
                    borderWidth: 2.5,
                    borderDash: [6, 4],
                    pointRadius: 0
                });
            }
            chart.data.datasets[6].data = singleSnapshotW ? singleSnapshotW.data : [];

            chart.update('none');
        }

        function normalize(d) { 
            if (!d || d.length === 0) return [];
            const s = d[0].c; 
            return d.map(v => (v.c - s)/s); 
        }
        
        function calcE(a, b) { 
            let s = 0; 
            for(let i=0; i<a.length; i++) s += (a[i]-b[i])**2; 
            return s; 
        }

        function initChart() {
            const canvas = document.getElementById('chartW');
            const ds = [
                { label: 'Real', data: [], borderColor: '#FFF', borderWidth: 1.5, pointRadius: 0, hitRadius: 20 },
                { label: 'Atual Verde', data: [], borderColor: '#00FF41', borderWidth: 2.5, pointRadius: 0, hitRadius: 20 }
            ];
            
            for(let i=0; i<4; i++) {
                ds.push({ label: `Rastro_${i}`, data: [], borderColor: colors[i], borderWidth: 0, hidden: true, pointRadius: 0 });
            }

            chartW = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: { datasets: ds },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    interaction: { mode: 'nearest', intersect: true, axis: 'xy' },
                    scales: { 
                        x: { type: 'time', grid: { display: false }, ticks: { color: '#555' } }, 
                        y: { position: 'right', grid: { color: '#111' }, ticks: { color: '#888' } } 
                    },
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { 
                            enabled: true, backgroundColor: 'rgba(0,0,0,0.95)', titleColor: '#00ff41', 
                            callbacks: { 
                                label: (ctx) => {
                                    const symbol = document.getElementById('symbol').value.toUpperCase();
                                    const prefix = symbol.includes('USD') ? '$' : 'R$';
                                    return `${prefix} ${ctx.parsed.y.toLocaleString('pt-BR')}`;
                                }
                            } 
                        } 
                    }
                }
            });

            let state = { drag: false, lx: 0, ly: 0 };
            const move = (ex, ey) => {
                if(!state.drag) return;
                const s = chartW.scales;
                const dx = ((ex - state.lx) / s.x.width) * (s.x.max - s.x.min);
                const dy = ((ey - state.ly) / s.y.height) * (s.y.max - s.y.min);
                chartW.options.scales.x.min = (chartW.options.scales.x.min || s.x.min) - dx;
                chartW.options.scales.x.max = (chartW.options.scales.x.max || s.x.max) - dx;
                chartW.options.scales.y.min = (chartW.options.scales.y.min || s.y.min) + dy;
                chartW.options.scales.y.max = (chartW.options.scales.y.max || s.y.max) + dy;
                state.lx = ex; state.ly = ey;
                chartW.update('none');
            };
            canvas.addEventListener('mousedown', e => { state.drag = true; state.lx = e.clientX; state.ly = e.clientY; });
            window.addEventListener('mouseup', () => state.drag = false);
            canvas.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const s = chartW.scales, f = e.deltaY > 0 ? 1.1 : 0.9;
                const xr = (s.x.max - s.x.min) * f, yr = (s.y.max - s.y.min) * f;
                const xm = (s.x.max + s.x.min)/2, ym = (s.y.max + s.y.min)/2;
                chartW.options.scales.x.min = xm - xr/2; chartW.options.scales.x.max = xm + xr/2;
                chartW.options.scales.y.min = ym - yr/2; chartW.options.scales.y.max = ym + yr/2;
                chartW.update('none');
            }, {passive: false});
        }

        window.onload = () => { initChart(); startSystem(); };
    </script>
</body>
</html>
