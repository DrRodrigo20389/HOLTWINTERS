<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SKYNET V-DARWIN - COMPETITIVE NEURAL ENGINE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        body { 
            background-color: #03070d; 
            color: #e0e6ed; 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            touch-action: none; 
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 90;
            opacity: 0.7;
        }

        .toolbar { 
            background: rgba(6, 11, 19, 0.95); 
            border-bottom: 1px solid rgba(0, 255, 136, 0.2); 
            padding: 6px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 10px;
            min-height: 55px; 
            flex-shrink: 0; 
            box-shadow: 0 4px 25px rgba(0,255,136,0.08); 
            z-index: 100; 
            backdrop-filter: blur(10px);
        }

        .logo-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem; 
            font-weight: 900; 
            letter-spacing: 1px; 
            color: #fff; 
            text-shadow: 0 0 10px rgba(0,255,136,0.5); 
            white-space: nowrap;
        }

        .logo-sub { 
            font-size: 0.55rem; 
            color: #00ff88; 
            font-weight: 700; 
            letter-spacing: 2px; 
            text-shadow: 0 0 5px rgba(0,255,136,0.3);
            white-space: nowrap;
        }

        .live-price { 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem; 
            font-weight: 900; 
            color: #00ff88; 
            text-shadow: 0 0 12px rgba(0,255,136,0.6); 
            padding: 5px 12px; 
            background: rgba(0,255,136,0.04); 
            border-radius: 2px; 
            border: 1px solid rgba(0,255,136,0.3); 
            box-shadow: inset 0 0 10px rgba(0,255,136,0.1);
            animation: pulseGlow 2.5s infinite alternate;
            text-align: center;
            flex-shrink: 0;
            white-space: nowrap;
        }

        @keyframes pulseGlow {
            from { box-shadow: inset 0 0 5px rgba(0,255,136,0.1), 0 0 5px rgba(0,255,136,0.2); }
            to { box-shadow: inset 0 0 12px rgba(0,255,136,0.2), 0 0 18px rgba(0,255,136,0.4); }
        }

        .main-container { 
            flex: 1; width: 100%; height: 100%; position: relative; 
            background: radial-gradient(circle at 50% 50%, #08101a 0%, #020408 100%); 
        }

        .chart-container { width: 100%; height: 100%; position: absolute; overflow: hidden; cursor: crosshair; }

        .hud-panel { 
            position: absolute; top: 15px; left: 15px; pointer-events: none; 
            background: rgba(6, 12, 20, 0.82); 
            border-left: 3px solid #00ff88; 
            padding: 14px 18px; 
            border-radius: 4px; 
            z-index: 10; 
            border-top: 1px solid rgba(0, 255, 136, 0.15); 
            border-right: 1px solid rgba(0, 255, 136, 0.15); 
            border-bottom: 1px solid rgba(0, 255, 136, 0.15); 
            min-width: 270px; 
            backdrop-filter: blur(12px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(0,255,136,0.05); 
        }

        .time-label { 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; font-weight: 700; color: #00d4ff; letter-spacing: 1px; 
            margin-bottom: 10px; border-bottom: 1px solid rgba(0,212,255,0.2); padding-bottom: 4px; 
        }

        .val-atual { color: #fff; font-weight: 700; font-size: 1.05rem; }
        .val-atual span { color: #00ff88; text-shadow: 0 0 8px rgba(0,255,136,0.4); }
        .val-conv { font-weight: 700; font-size: 0.9rem; margin-top: 6px; color: #aaa; }
        .val-conv span { color: #00ff88; text-shadow: 0 0 8px rgba(0,255,136,0.4); }
        .dif-text { font-size: 0.75rem; color: #788b9e; margin-top: 2px; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
        .metric-box { 
            background: rgba(0, 255, 136, 0.02); 
            padding: 8px; border-radius: 3px; text-align: center; 
            border: 1px solid rgba(0, 255, 136, 0.12); 
        }
        .metric-title { font-size: 0.55rem; color: #647a8e; font-weight: bold; letter-spacing: 1px; margin-bottom: 3px; }
        .metric-value { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: #00ff88; }
        
        .cohesion-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.1); margin-top: 5px; border-radius: 2px; overflow: hidden; }
        .cohesion-fill { height: 100%; width: 0%; background: #00ff88; box-shadow: 0 0 6px #00ff88; transition: width 0.4s ease; }

        .controls { display: flex; gap: 6px; align-items: center; flex-shrink: 1; flex-wrap: nowrap; }
        .btn-nav { 
            background: rgba(12, 22, 34, 0.8); 
            border: 1px solid rgba(0, 212, 255, 0.3); 
            color: #00d4ff; 
            padding: 5px 10px; 
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem; font-weight: bold; cursor: pointer; 
            border-radius: 2px; transition: all 0.2s; 
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
            white-space: nowrap;
        }
        .btn-nav:hover { 
            background: rgba(0, 212, 255, 0.15); 
            border-color: #00d4ff; color: #fff; 
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }
        .btn-reset { border-color: rgba(255, 50, 50, 0.4); color: #ff5555; }
        .btn-reset:hover { background: rgba(255, 50, 50, 0.15); border-color: #ff5555; color: #fff; box-shadow: 0 0 10px rgba(255, 85, 85, 0.4); }
        .btn-export { background: rgba(0, 255, 136, 0.05); border-color: rgba(0, 255, 136, 0.4); color: #00ff88; }
        .btn-export:hover { background: rgba(0, 255, 136, 0.2); border-color: #00ff88; color: #fff; box-shadow: 0 0 10px rgba(0,255,136,0.5); }
        
        .btn-scale { 
            position: absolute; top: 15px; right: 15px; 
            background: rgba(10, 20, 30, 0.8); 
            border: 1px solid rgba(0, 212, 255, 0.3); 
            color: #00d4ff; padding: 5px 12px; font-size: 0.7rem; 
            cursor: pointer; z-index: 100; border-radius: 2px; font-weight: bold; 
            transition: 0.3s; backdrop-filter: blur(6px); 
        }
        .btn-scale:hover { background: rgba(0, 212, 255, 0.2); color: #fff; box-shadow: 0 0 10px rgba(0,212,255,0.4); }
        
        input[type="text"], input[type="number"] { 
            background: rgba(5, 12, 20, 0.9); 
            border: 1px solid rgba(0, 212, 255, 0.3); 
            color: #00ff88; padding: 4px 6px; font-size: 0.8rem; 
            font-family: 'Share Tech Mono', monospace; font-weight: bold; 
            border-radius: 2px; outline: none; transition: all 0.3s; text-align: center; 
        }
        input[type="text"]:focus, input[type="number"]:focus { border-color: #00ff88; box-shadow: 0 0 8px rgba(0,255,136,0.4); }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="toolbar">
        <div>
            <div class="logo-title">SKYNET V-DARWIN</div>
            <div class="logo-sub">NEURAL DATA MINING</div>
        </div>
        
        <div class="controls">
            <input type="text" id="symbol" value="BTCBRL" style="width: 75px;">
            <span style="font-size:0.65rem; color:#00d4ff; font-weight:bold; letter-spacing:1px; white-space:nowrap;">LIMIAR (%):</span>
            <input type="number" id="minFitLimit" value="66" step="1" min="1" max="100" style="width: 40px;" onchange="refreshEngine()">

            <button class="btn-nav" onclick="startSystem()" style="border-color: #00ff88; color: #00ff88;">SYNC</button>
            <div style="width: 1px; background: rgba(255,255,255,0.1); margin: 0 2px; height: 22px;"></div>
            <button class="btn-nav" onclick="stepTime(1)">◀ -1 SEM</button>
            <button class="btn-nav" onclick="stepTime(-1)">+1 SEM ▶</button>
            <button class="btn-nav btn-reset" onclick="resetTime()">LIVE</button>
            <div style="width: 1px; background: rgba(255,255,255,0.1); margin: 0 2px; height: 22px;"></div>
            <button class="btn-nav btn-export" id="btnExport" onclick="exportDataToCSV()">EXPORTAR MATRIZ</button>
        </div>

        <div class="live-price" id="mainPrice">A CARREGAR...</div>
    </div>

    <div class="main-container">
        <button class="btn-scale" onclick="resetScale()">CENTRAR GRÁFICO</button>
        <div class="hud-panel">
            <div class="time-label">VISÃO ESTRUTURAL SEMANAL (COMPETIÇÃO ATIVA)</div>
            <div id="targetW" class="val-atual">PREÇO: <span>---</span></div>
            <div id="convW" class="val-conv">ALVO (VENCEDOR): <span>---</span></div>
            <div id="difW" class="dif-text">DIFERENCIAL: ---</div>
            
            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-title">ROTA DOMINANTE</div>
                    <div class="metric-value" id="winnerGhost">---</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">COESÃO DA ROTA</div>
                    <div class="metric-value" id="cohesionVal">---</div>
                    <div class="cohesion-bar"><div id="cohesionFill" class="cohesion-fill"></div></div>
                </div>
            </div>
            <div id="anchorDate" style="font-size: 0.65rem; color: #5a6e7f; text-align: center; margin-top: 10px; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.1);">ANCORADO EM: ---</div>
        </div>
        <div class="chart-container"><canvas id="chartW"></canvas></div>
    </div>

    <script>
        let chartW, histW = [];
        let ws;
        let timeShift = 0;
        let activeDarwinState = null;

        function getMinFitLimit() {
            const val = parseFloat(document.getElementById('minFitLimit').value);
            return isNaN(val) ? 66 : val;
        }

        function resetScale() {
            if(!chartW) return;
            chartW.options.scales.x.min = undefined; chartW.options.scales.x.max = undefined;
            chartW.options.scales.y.min = undefined; chartW.options.scales.y.max = undefined;
            chartW.update();
        }

        function stepTime(delta) {
            const maxShift = Math.max(0, histW.length - 90);
            timeShift = Math.min(maxShift, Math.max(0, timeShift + delta));
            refreshEngine();
        }

        function resetTime() {
            timeShift = 0;
            refreshEngine();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') stepTime(1);
            if (e.key === 'ArrowRight') stepTime(-1);
        });

        async function startSystem() {
            if(ws) ws.close();
            const symbol = document.getElementById('symbol').value.toUpperCase();
            timeShift = 0;
            
            try {
                const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1w&limit=1000`);
                const data = await r.json();
                histW = data.map(d => ({ 
                    x: d[0], o: parseFloat(d[1]), h: parseFloat(d[2]), l: parseFloat(d[3]), c: parseFloat(d[4]) 
                }));
                connectStream(symbol); 
                refreshEngine();
            } catch(e) {
                console.error("Erro:", e);
                document.getElementById('mainPrice').innerText = "ERRO DE REDE";
            }
        }

        function connectStream(symbol) {
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_1m`);
            ws.onmessage = (e) => {
                const k = JSON.parse(e.data).k;
                const p = parseFloat(k.c);
                if (timeShift === 0) {
                    const prefix = symbol.includes('USD') ? '$' : 'R$';
                    document.getElementById('mainPrice').innerText = `${prefix} ${p.toLocaleString('pt-BR')}`;
                }
                if(histW.length) {
                    histW[histW.length-1].c = p;
                }
                if (timeShift === 0) refreshEngine();
            };
        }

        function calcRobustError(curData, candData) { 
            let s = 0; 
            const curBase = curData[0].c;
            const candBase = candData[0].c;
            
            for(let i=0; i < curData.length; i++) {
                let curNorm = (curData[i].c - curBase) / curBase;
                let candNorm = (candData[i].c - candBase) / candBase;
                s += Math.abs(curNorm - candNorm);
            }
            return s; 
        }

        function findGhostsForIndex(hist, targetIdx, pLen = 40, fLen = 40) {
            const step = hist[1].x - hist[0].x;
            const curSlice = hist.slice(targetIdx - pLen, targetIdx);
            const anchorPrice = hist[targetIdx].c;

            let allMatches = [];
            const maxSearchIndex = targetIdx - pLen - fLen - 1;

            if (maxSearchIndex <= 0) return null;

            for(let i = 0; i < maxSearchIndex; i++) {
                const sample = hist.slice(i, i + pLen);
                if(sample.length < pLen) continue;
                let error = calcRobustError(curSlice, sample);
                allMatches.push({ idx: i, error: error });
            }

            if (allMatches.length === 0) return null;
            allMatches.sort((a, b) => a.error - b.error);

            let topK = [];
            for (let m of allMatches) {
                let isOverlap = topK.some(t => Math.abs(t.idx - m.idx) < (pLen * 0.75));
                if (!isOverlap) {
                    topK.push(m);
                    if (topK.length === 3) break; 
                }
            }

            if (topK.length === 0) return null;

            let ghosts = [];
            topK.forEach((match, index) => {
                const fut = hist.slice(match.idx + pLen, match.idx + pLen + fLen);
                if (fut.length === 0) return;
                const bR = hist[match.idx + pLen - 1].c; 
                
                let points = fut.map((d, k) => {
                    let percentChange = (d.c - bR) / bR;
                    return { x: hist[targetIdx].x + ((k+1) * step), y: anchorPrice * (1 + percentChange) };
                });
                ghosts.push({ id: `FANTASMA ${index+1}`, points: points });
            });

            if (ghosts.length === 0) return null;
            return { anchorIdx: targetIdx, anchorTime: hist[targetIdx].x, ghosts: ghosts };
        }

        function evaluateDarwinEngine(histFull, evalEndIdx, returnFullLog = false) {
            const minFit = getMinFitLimit();
            let ensemble = null;
            let logMatrix = [];

            const pLen = 40, fLen = 40;
            const startIndex = Math.max(pLen + 10, evalEndIdx - 300);

            for (let i = startIndex; i <= evalEndIdx; i++) {
                let resetNeeded = false;
                
                if (ensemble) {
                    let elapsed = i - ensemble.anchorIdx;
                    
                    if (elapsed >= fLen) {
                        resetNeeded = true;
                    } else {
                        const actualSlice = histFull.slice(ensemble.anchorIdx, i + 1);
                        let bestCohesion = -1;
                        let winnerIdx = -1;

                        for (let g = 0; g < ensemble.ghosts.length; g++) {
                            const ghostPoints = ensemble.ghosts[g].points;
                            let mapeSum = 0;
                            let countValid = 0;
                            for(let k = 0; k < actualSlice.length; k++){
                                if (ghostPoints[k] && ghostPoints[k].y) {
                                    mapeSum += Math.abs(actualSlice[k].c - ghostPoints[k].y) / actualSlice[k].c;
                                    countValid++;
                                }
                            }
                            let meanErr = countValid > 0 ? (mapeSum / countValid) : 1.0;
                            let cohesion = Math.max(0, 100 - (meanErr * 150));
                            
                            ensemble.ghosts[g].currentCohesion = cohesion;

                            if (cohesion > bestCohesion) {
                                bestCohesion = cohesion;
                                winnerIdx = g;
                            }
                        }

                        if (winnerIdx !== -1) {
                            ensemble.winnerIndex = winnerIdx;
                            ensemble.winnerCohesion = bestCohesion;
                        }

                        if (bestCohesion < minFit) {
                            resetNeeded = true;
                        }

                        if(returnFullLog && winnerIdx !== -1) {
                            const wPoints = ensemble.ghosts[winnerIdx].points;
                            logMatrix.push({
                                Data_Atual: new Date(histFull[i].x).toLocaleDateString('pt-BR'),
                                Preco_Real: histFull[i].c.toFixed(2),
                                Semanas_Desde_Ancora: elapsed,
                                Vencedor_Atual: ensemble.ghosts[winnerIdx].id,
                                Coesao_Vencedor: bestCohesion.toFixed(2) + "%",
                                Preco_Previsto_G1: ensemble.ghosts[0] && ensemble.ghosts[0].points[elapsed-1] ? ensemble.ghosts[0].points[elapsed-1].y.toFixed(2) : "",
                                Preco_Previsto_G2: ensemble.ghosts[1] && ensemble.ghosts[1].points[elapsed-1] ? ensemble.ghosts[1].points[elapsed-1].y.toFixed(2) : "",
                                Preco_Previsto_G3: ensemble.ghosts[2] && ensemble.ghosts[2].points[elapsed-1] ? ensemble.ghosts[2].points[elapsed-1].y.toFixed(2) : "",
                                Status: resetNeeded ? "ROMPIMENTO (RECALCULANDO)" : "FIXADO"
                            });
                        }
                    }
                }

                if (!ensemble || resetNeeded) {
                    ensemble = findGhostsForIndex(histFull, i, pLen, fLen);
                    if(ensemble) {
                        ensemble.winnerIndex = 0;
                        ensemble.winnerCohesion = 100;
                        ensemble.ghosts.forEach(g => g.currentCohesion = 100);
                        
                        if(returnFullLog) {
                            logMatrix.push({
                                Data_Atual: new Date(histFull[i].x).toLocaleDateString('pt-BR'),
                                Preco_Real: histFull[i].c.toFixed(2),
                                Semanas_Desde_Ancora: 0,
                                Vencedor_Atual: "NOVA ÂNCORA",
                                Coesao_Vencedor: "100%",
                                Preco_Previsto_G1: "", Preco_Previsto_G2: "", Preco_Previsto_G3: "",
                                Status: "INICIANDO NOVA BUSCA"
                            });
                        }
                    }
                }
            }

            return returnFullLog ? logMatrix : ensemble;
        }

        function exportDataToCSV() {
            if (histW.length < 100) { alert("Dados insuficientes para gerar matriz."); return; }
            
            const btn = document.getElementById('btnExport');
            btn.innerText = "A PROCESSAR CSV...";
            btn.style.color = "#ff9900";

            setTimeout(() => {
                try {
                    const logData = evaluateDarwinEngine(histW, histW.length - 1, true);
                    
                    if (!logData || logData.length === 0) {
                        alert("Nenhum dado gerado para a matriz.");
                        btn.innerText = "EXPORTAR MATRIZ";
                        btn.style.color = "#00d4ff";
                        return;
                    }

                    let csvContent = "Data_Atual,Preco_Real,Semanas_Desde_Ancora,Vencedor_Atual,Coesao_Vencedor,Preco_Previsto_G1,Preco_Previsto_G2,Preco_Previsto_G3,Status\n";
                    
                    logData.forEach(row => {
                        csvContent += `${row.Data_Atual},${row.Preco_Real},${row.Semanas_Desde_Ancora},${row.Vencedor_Atual},${row.Coesao_Vencedor},${row.Preco_Previsto_G1},${row.Preco_Previsto_G2},${row.Preco_Previsto_G3},${row.Status}\n`;
                    });

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `SKYNET_MATRIZ_DADOS_${document.getElementById('symbol').value}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    btn.innerText = "EXPORTAR MATRIZ";
                    btn.style.color = "#00d4ff";
                } catch (err) {
                    console.error(err);
                    alert("Erro ao exportar CSV: " + err.message);
                    btn.innerText = "EXPORTAR MATRIZ";
                    btn.style.color = "#00d4ff";
                }
            }, 50);
        }

        function refreshEngine() {
            const evalEndIdx = timeShift > 0 ? (histW.length - 1) - timeShift : (histW.length - 1);
            const prefix = document.getElementById('symbol').value.includes('USD') ? '$' : 'R$';

            if (timeShift > 0) {
                document.getElementById('mainPrice').innerText = `RECUO: -${timeShift} SEM`;
                document.getElementById('mainPrice').style.color = '#ff9900';
            } else {
                document.getElementById('mainPrice').style.color = '#00ff88';
            }

            activeDarwinState = evaluateDarwinEngine(histW, evalEndIdx, false);

            if(!activeDarwinState) {
                chartW.update('none'); return;
            }

            const currentPrice = histW[evalEndIdx].c;
            const winnerGhost = activeDarwinState.ghosts[activeDarwinState.winnerIndex];
            const finalTarget = winnerGhost && winnerGhost.points.length > 0 ? winnerGhost.points[winnerGhost.points.length-1].y : currentPrice;
            
            document.getElementById('targetW').innerHTML = `PREÇO: <span>${prefix} ${currentPrice.toLocaleString('pt-BR', {maximumFractionDigits:0})}</span>`;
            document.getElementById('convW').innerHTML = `ALVO (VENCEDOR): <span style="color:#00ff88;">${prefix} ${finalTarget.toLocaleString('pt-BR', {maximumFractionDigits:0})}</span>`;
            
            const diff = ((finalTarget - currentPrice) / currentPrice * 100).toFixed(2);
            document.getElementById('difW').innerText = `DISTÂNCIA ALVO: ${diff > 0 ? '+' : ''}${diff}%`;

            document.getElementById('winnerGhost').innerText = winnerGhost ? winnerGhost.id : '---';
            
            const cohesionEl = document.getElementById('cohesionVal');
            const cohesionFill = document.getElementById('cohesionFill');
            const cohesion = activeDarwinState.winnerCohesion;
            
            cohesionEl.innerText = `${cohesion.toFixed(1)}%`;
            cohesionFill.style.width = `${Math.min(100, Math.max(0, cohesion))}%`;

            const cohesionColor = cohesion >= 80 ? '#00ff88' : (cohesion >= 60 ? '#ffcc00' : '#ff4444');
            cohesionEl.style.color = cohesionColor;
            cohesionFill.style.background = cohesionColor;
            cohesionFill.style.boxShadow = `0 0 8px ${cohesionColor}`;

            document.getElementById('anchorDate').innerText = `SISTEMA ANCORADO DESDE: ${new Date(activeDarwinState.anchorTime).toLocaleDateString('pt-BR')}`;

            const histToDraw = histW.slice(0, evalEndIdx + 1);
            chartW.data.datasets[0].data = histToDraw.slice(-350).map(d => ({x: d.x, y: d.c}));
            
            for(let i=1; i<=3; i++) chartW.data.datasets[i].data = [];
            chartW.data.datasets[4].data = [];

            let datasetIdx = 1;
            activeDarwinState.ghosts.forEach((ghost, idx) => {
                let plotData = [{x: histFull[activeDarwinState.anchorIdx].x, y: histFull[activeDarwinState.anchorIdx].c}, ...ghost.points];
                if (idx === activeDarwinState.winnerIndex) {
                    chartW.data.datasets[4].data = plotData;
                    chartW.data.datasets[4].label = `ROTA PRINCIPAL (${ghost.id})`;
                } else {
                    chartW.data.datasets[datasetIdx].data = plotData;
                    chartW.data.datasets[datasetIdx].label = `Standby: ${ghost.id}`;
                    datasetIdx++;
                }
            });

            chartW.update('none');
        }

        let histFull = []; 
        setInterval(() => { histFull = histW; }, 1000);

        function initChart() {
            const canvas = document.getElementById('chartW');
            const ctx = canvas.getContext('2d');

            const gradientGreen = ctx.createLinearGradient(0, 0, 0, 400);
            gradientGreen.addColorStop(0, 'rgba(0, 255, 136, 0.25)');
            gradientGreen.addColorStop(1, 'rgba(0, 255, 136, 0.0)');

            const ds = [
                { 
                    label: 'Preço Real', data: [], borderColor: '#ffffff', borderWidth: 2, 
                    pointRadius: 0, hitRadius: 15, tension: 0, z: 10
                }
            ];
            
            const ghostColors = ['rgba(0, 212, 255, 0.4)', 'rgba(120, 80, 255, 0.35)'];
            for(let i=0; i<2; i++) {
                ds.push({ label: `Standby`, data: [], borderColor: ghostColors[i], borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, hitRadius: 15, tension: 0, z: 1 });
            }
            ds.push({ label: `Standby Extra`, data: [], borderColor: 'transparent', borderWidth: 0 });

            ds.push({ 
                label: 'ROTA PRINCIPAL', data: [], 
                borderColor: '#00ff88', borderWidth: 3.5, pointRadius: 0, hitRadius: 20, tension: 0, 
                backgroundColor: gradientGreen, fill: true, z: 5 
            });

            chartW = new Chart(ctx, {
                type: 'line',
                data: { datasets: ds },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    interaction: { mode: 'nearest', intersect: true }, 
                    layout: { padding: { right: 50 } },
                    scales: { 
                        x: { 
                            type: 'time', 
                            grid: { display: true, color: 'rgba(0, 212, 255, 0.05)' }, 
                            ticks: { color: '#647a8e', font: { family: 'Share Tech Mono' } } 
                        }, 
                        y: { 
                            position: 'right', 
                            grid: { color: 'rgba(0, 212, 255, 0.05)' }, 
                            ticks: { color: '#00d4ff', font: { family: 'Share Tech Mono', weight: 'bold' } } 
                        } 
                    },
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { 
                            enabled: true, mode: 'nearest', intersect: true,
                            backgroundColor: 'rgba(4, 10, 18, 0.95)', 
                            titleColor: '#00d4ff', 
                            bodyColor: '#00ff88',
                            borderColor: 'rgba(0, 255, 136, 0.3)',
                            borderWidth: 1,
                            displayColors: false,
                            bodyFont: { size: 12, family: 'Share Tech Mono', weight: 'bold' }, 
                            padding: 10,
                            callbacks: { 
                                title: (tooltipItems) => {
                                    const rawTimestamp = tooltipItems[0].parsed.x;
                                    const date = new Date(rawTimestamp);
                                    return "DATA: " + date.toLocaleDateString('pt-BR');
                                },
                                label: (ctx) => {
                                    const prefix = document.getElementById('symbol').value.includes('USD') ? '$' : 'R$';
                                    const pointVal = ctx.parsed.y;
                                    const pointTimestamp = ctx.parsed.x;
                                    
                                    // Obter o índice e timestamp de referência ativo no momento na tela
                                    const evalEndIdx = timeShift > 0 ? (histW.length - 1) - timeShift : (histW.length - 1);
                                    const refPrice = (histW.length && histW[evalEndIdx]) ? histW[evalEndIdx].c : pointVal;
                                    const refTimestamp = (histW.length && histW[evalEndIdx]) ? histW[evalEndIdx].x : pointTimestamp;
                                    
                                    // Cálculo de variação percentual
                                    const pctDiff = ((pointVal - refPrice) / refPrice) * 100;
                                    const formattedPct = (pctDiff >= 0 ? '+' : '') + pctDiff.toFixed(2) + '%';
                                    
                                    // Cálculo da distância temporal em Semanas e Dias
                                    const diffMs = pointTimestamp - refTimestamp;
                                    const absDaysTotal = Math.round(Math.abs(diffMs) / (1000 * 60 * 60 * 24));
                                    const weeks = Math.floor(absDaysTotal / 7);
                                    const days = absDaysTotal % 7;
                                    
                                    let timeStr = "";
                                    if (diffMs === 0) {
                                        timeStr = "DIST: REF (0 sem)";
                                    } else {
                                        const sign = diffMs > 0 ? "+" : "-";
                                        let parts = [];
                                        if (weeks > 0) parts.push(`${weeks} sem`);
                                        if (days > 0 || weeks === 0) parts.push(`${days}d`);
                                        timeStr = `DIST: ${sign}${parts.join(' ')}`;
                                    }
                                    
                                    return [
                                        `${ctx.dataset.label}`,
                                        `${prefix} ${pointVal.toLocaleString('pt-BR', {maximumFractionDigits:0})}`,
                                        `VAR: ${formattedPct}`,
                                        timeStr
                                    ];
                                }
                            } 
                        } 
                    }
                }
            });

            let state = { drag: false, lx: 0, ly: 0 };
            const move = (ex, ey) => {
                if(!state.drag) return;
                const s = chartW.scales;
                const dx = ((ex - state.lx) / s.x.width) * (s.x.max - s.x.min);
                const dy = ((ey - state.ly) / s.y.height) * (s.y.max - s.y.min);
                chartW.options.scales.x.min = s.x.min - dx; chartW.options.scales.x.max = s.x.max - dx;
                chartW.options.scales.y.min = s.y.min + dy; chartW.options.scales.y.max = s.y.max + dy;
                state.lx = ex; state.ly = ey;
                chartW.update('none');
            };
            canvas.addEventListener('mousedown', e => { state.drag = true; state.lx = e.clientX; state.ly = e.clientY; });
            window.addEventListener('mouseup', () => state.drag = false);
            canvas.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const s = chartW.scales, f = e.deltaY > 0 ? 1.1 : 0.9;
                const xr = (s.x.max - s.x.min) * f, xm = (s.x.max + s.x.min) / 2;
                chartW.options.scales.x.min = xm - xr / 2; chartW.options.scales.x.max = xm + xr / 2;
                const yr = (s.y.max - s.y.min) * f, ym = (s.y.max + s.y.min) / 2;
                chartW.options.scales.y.min = ym - yr / 2; chartW.options.scales.y.max = ym + yr / 2;
                chartW.update('none');
            }, {passive: false});
        }

        window.onload = () => { initChart(); startSystem(); };
    </script>
</body>
</html>
